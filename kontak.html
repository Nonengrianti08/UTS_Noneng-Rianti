<main class="noneng_container">

    <section class="noneng_page_heading">
        <h1>Hubungi Kami</h1>
        <p>Silakan hubungi SMP IT Al-Barokah</p>
    </section>

    <section class="noneng_section">
        <h2>Informasi Kontak</h2>
        <p><b>Nama Sekolah:</b> SMP IT Al-Barokah</p>
        <p><b>Alamat:</b> kp.sindangkasih RT/RW 03/09.</p>
        <p><b>Email:</b> info@albarokah.sch.id</p>

    </section>

    <section class="noneng_section">
        <h2>Kirim Pesan</h2>

        <form id="noneng_contact_form">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama"
                placeholder="Masukkan nama lengkap" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                placeholder="Masukkan email" required>

            <label for="pesan">Pesan</label>
            <textarea id="pesan" name="pesan"
                placeholder="Tuliskan pesan kamu" required></textarea>

            <button type="submit">Kirim Pesan</button>
            <p id="noneng_form_message"></p>
        </form>
    </section>
